name: ata-project-service CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'ata-project-service/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'ata-project-service/**'

defaults:
  run:
    working-directory: ata-project-service

jobs:
  lint-and-test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ata_test_db
          POSTGRES_USER: ata_user
          POSTGRES_PASSWORD: ata_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ata_user:ata_password@localhost:5432/ata_test_db
      REDIS_URL: redis://localhost:6379
      INTERNAL_API_KEY: test-internal-key
      AUTH_SERVICE_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ata-project-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --forceExit --passWithNoTests

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ata-project-service:${{ github.sha }} .
