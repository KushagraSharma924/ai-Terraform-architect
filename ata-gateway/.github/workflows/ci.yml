name: ata-gateway CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'ata-gateway/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'ata-gateway/**'

defaults:
  run:
    working-directory: ata-gateway

jobs:
  lint-and-test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ata-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --forceExit --passWithNoTests

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ata-gateway:${{ github.sha }} .
