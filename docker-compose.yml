services:
  # ─── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: ata-postgres
    environment:
      POSTGRES_DB: ata_db
      POSTGRES_USER: ata_user
      POSTGRES_PASSWORD: ata_password
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ata_user -d ata_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ata-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    platform: linux/amd64
    container_name: ata-mailhog
    ports:
      - '1025:1025'  # SMTP
      - '8025:8025'  # Web UI
    logging:
      driver: none

  # ─── Services ─────────────────────────────────────────────────────────────────

  auth-service:
    build:
      context: ./ata-auth-service
      dockerfile: Dockerfile
    container_name: ata-auth-service
    env_file: ./ata-auth-service/.env
    environment:
      DATABASE_URL: postgresql://ata_user:ata_password@postgres:5432/ata_db
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  project-service:
    build:
      context: ./ata-project-service
      dockerfile: Dockerfile
    container_name: ata-project-service
    env_file: ./ata-project-service/.env
    environment:
      DATABASE_URL: postgresql://ata_user:ata_password@postgres:5432/ata_db
      AUTH_SERVICE_URL: http://auth-service:3001
    ports:
      - '3002:3002'
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped

  gateway:
    build:
      context: ./ata-gateway
      dockerfile: Dockerfile
    container_name: ata-gateway
    env_file: ./ata-gateway/.env
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
      PROJECT_SERVICE_URL: http://project-service:3002
      INTENT_SERVICE_URL: http://intent-service:3004
    ports:
      - '3000:3000'
    depends_on:
      - auth-service
      - project-service
      - intent-service
    restart: unless-stopped

  intent-service:
    build:
      context: ./ata-intent-service
      dockerfile: Dockerfile
    container_name: ata-intent-service
    env_file: ./ata-intent-service/.env
    environment:
      DATABASE_URL: postgresql://ata_user:ata_password@postgres:5432/ata_db
      REDIS_URL: redis://redis:6379
      PROJECT_SERVICE_URL: http://project-service:3002
    ports:
      - '3004:3004'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      project-service:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./ata-frontend
      dockerfile: Dockerfile
    container_name: ata-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - '3003:3000'
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
